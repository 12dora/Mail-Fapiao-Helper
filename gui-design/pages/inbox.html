<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>邮件记录 · 发票助手</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body data-page="inbox">
<div class="app">
    <div id="titlebar-mount"></div>
    <div id="app-shell"></div>

    <main class="main">
        <div class="toolbar">
            <span class="toolbar__crumb">日常操作</span>
            <h1 class="toolbar__title" tabindex="-1">邮件记录</h1>
            <div class="toolbar__spacer"></div>
            <span class="toolbar__meta"><span data-inbox="total">0</span> 封邮件 · 已保存的邮件</span>
        </div>

        <div class="page stagger">
            <!-- 统计卡片 -->
            <div class="stats">
                <div class="stat">
                    <div class="stat__label">累计邮件</div>
                    <div class="stat__value" data-inbox="total">0</div>
                    <div class="stat__delta">已保存的邮件</div>
                </div>
                <div class="stat">
                    <div class="stat__label">有附件</div>
                    <div class="stat__value" data-inbox="with-attachment">0</div>
                    <div class="stat__delta" data-inbox-delta="attachment">占比 —</div>
                </div>
                <div class="stat">
                    <div class="stat__label">含链接</div>
                    <div class="stat__value" data-inbox="with-links">0</div>
                    <div class="stat__delta" data-inbox-delta="links">占比 —</div>
                </div>
                <div class="stat">
                    <div class="stat__label">最早邮件</div>
                    <div class="stat__value mono" style="font-size: 16px;" data-inbox="earliest">暂无</div>
                    <div class="stat__delta is-flat">最早月份</div>
                </div>
            </div>

            <!-- 过滤栏 -->
            <div class="filterbar">
                <label class="sr-only" for="inbox-search">在已加载的邮件记录中搜索主题、发件人或编号</label>
                <input class="input" type="search" id="inbox-search" data-search="inbox" placeholder="在已加载的记录中搜索主题、发件人、编号…" style="width: 280px;">

                <button class="chip" type="button" data-toggle data-filter="inbox-attachment" aria-pressed="false">
                    <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    有附件
                </button>
                <button class="chip" type="button" data-toggle data-filter="inbox-links" aria-pressed="false">
                    <svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    含链接
                </button>

                <div class="spacer"></div>
                <button class="btn btn--sm" type="button" data-action="export-table">复制当前筛选结果</button>
                <button class="btn btn--sm" type="button" data-action="open-samples-folder">打开已保存的邮件</button>
            </div>

            <!-- 结果统计 -->
            <div class="row row--between mt-24">
                <div class="small mono muted" data-inbox-page>显示 0 · 已加载 0 · 共 0 行</div>
            </div>

            <div class="table-wrap">
                <!-- 同 library：给整表宽度下限，窄窗口下横向滚动而不是压扁各列。 -->
                <table class="table" style="min-width: 1000px;">
                    <thead>
                        <tr>
                            <th style="width: 140px;" data-sort-key="date">日期</th>
                            <th style="width: 220px;" data-sort-key="from">发件人</th>
                            <!-- 同 library：其余列宽度固定，主题是唯一自适应列，窄窗口下会被
                                 压到逐字换行。给下限，宽度不足时由 .table-wrap 横向滚动。 -->
                            <th style="min-width: 260px;" data-sort-key="subject">主题</th>
                            <th class="col-secondary" style="width: 90px;" data-sort-key="hasAttachment">附件</th>
                            <th class="col-secondary" style="width: 70px;" data-sort-key="bodyLinkCount">链接</th>
                            <th class="col-secondary" style="width: 110px;" data-sort-key="mailbox">邮箱</th>
                            <th style="width: 100px;">状态</th>
                        </tr>
                    </thead>
                    <tbody data-inbox-rows>
                        <tr><td colspan="7" class="muted">还没有已保存的邮件。请到「开始处理」，选择日期后点击「获取邮件」。</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="load-more" data-load-more="inbox"></div>
        </div>
    </main>
</div>

<script src="../scripts/shell.js"></script>
</body>
</html>
