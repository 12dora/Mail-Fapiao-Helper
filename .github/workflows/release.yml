name: Release

# Official, signed releases only.
#
# CODE-05A: this workflow publishes `draft: false, prerelease: false` GitHub
# Releases, so every artifact it ships MUST carry a full trust chain — macOS
# Developer ID + notarization + stapled ticket, Windows Authenticode + RFC3161
# timestamp. If the signing secrets are not configured the run fails in the
# cheap `resolve` job, before anything is built.
#
# Unsigned builds are produced by .github/workflows/dev-build.yml, which has no
# `contents: write` permission and can only emit workflow artifacts. There is no
# code path in this repository that turns an unsigned binary into a Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的发布 tag，例如 v0.1.0（必须已推送，且 semver 与 package.json 一致）'
        required: true
        type: string

# Least privilege by default; only the publishing job gets write access.
permissions:
  contents: read

concurrency:
  # Never let two runs race to publish the same tag.
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # CODE-05B: resolve the requested tag to one immutable commit SHA *before*
  # anything is built, and refuse the run if the tag does not already exist,
  # already has a published release, or disagrees with package.json.
  resolve:
    name: Resolve and verify release ref
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      # Fail closed, and fail cheap: no point building for 20 minutes only to
      # discover at publish time that nothing can be signed.
      - name: Require a complete signing trust chain
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -uo pipefail
          MISSING=""
          need() { [ -n "${!1:-}" ] || MISSING="${MISSING}\n  - ${1}"; }

          need MACOS_CERTIFICATE_P12
          need MACOS_CERTIFICATE_PASSWORD
          need WINDOWS_CERTIFICATE_PFX
          need WINDOWS_CERTIFICATE_PASSWORD

          # Notarization accepts either credential set.
          if [ -n "${APPLE_API_KEY_BASE64}" ] && [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER}" ]; then
            :
          elif [ -n "${APPLE_ID}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -n "${APPLE_TEAM_ID}" ]; then
            :
          else
            MISSING="${MISSING}\n  - notarization credentials: APPLE_API_KEY_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID"
          fi

          if [ -n "${MISSING}" ]; then
            echo "::error::Cannot cut an official release: the signing trust chain is incomplete."
            printf 'Missing repository secrets:%b\n\n' "${MISSING}"
            echo "An official Release must be signed, notarized (macOS) and timestamped (Windows)."
            echo "Unsigned binaries are never published as a Release."
            echo "To produce an unsigned build for testing, run the \"Development build (unsigned)\" workflow;"
            echo "it uploads workflow artifacts only."
            exit 1
          fi
          echo "Signing trust chain is fully configured."

      - name: Resolve tag to an immutable commit
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              echo "::error::Release runs must be triggered by a tag ref, got ref_type=${GITHUB_REF_TYPE}"
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${TAG}" ]; then
            echo "::error::No release tag was provided"
            exit 1
          fi

          # Strict semver, v-prefixed. Rejects branch names, arbitrary refs and
          # anything that cannot be compared against package.json.
          if ! printf '%s' "${TAG}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${TAG}' is not a v-prefixed semver tag (expected e.g. v0.1.0)"
            exit 1
          fi

          # The tag must already exist on the remote. A dispatch can therefore
          # never invent a tag, and can never attach binaries to a ref that does
          # not resolve to real, pushed source.
          if ! REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)"; then
            echo "::error::Tag '${TAG}' does not exist in ${GITHUB_REPOSITORY}. Push the tag first."
            exit 1
          fi

          OBJ_TYPE="$(printf '%s' "${REF_JSON}" | jq -r '.object.type')"
          OBJ_SHA="$(printf '%s' "${REF_JSON}" | jq -r '.object.sha')"
          if [ "${OBJ_TYPE}" = "tag" ]; then
            # Annotated tag: dereference to the commit it points at.
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}" --jq '.object.sha')"
          else
            SHA="${OBJ_SHA}"
          fi

          if ! printf '%s' "${SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve tag '${TAG}' to a commit SHA (got '${SHA}')"
            exit 1
          fi

          # On a tag push the resolved tag must still point at the commit this
          # run was created for; otherwise the tag moved and the run is stale.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::Tag '${TAG}' now points at ${SHA} but this run was triggered on ${GITHUB_SHA}; the tag was moved."
            exit 1
          fi

          # A tag that already produced a published release is treated as
          # immutable: republishing would silently swap the binaries users have.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::A release already exists for '${TAG}'. Delete it deliberately, or publish a new tag."
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "sha=${SHA}"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved ${TAG} -> ${SHA}"

      - name: Checkout resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false

      - name: Enforce tag/package version agreement
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${{ steps.ref.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.ref.outputs.tag }} implies version ${{ steps.ref.outputs.version }} but package.json at ${{ steps.ref.outputs.sha }} says ${PKG_VERSION}"
            exit 1
          fi
          echo "package.json version ${PKG_VERSION} matches ${{ steps.ref.outputs.tag }}"

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: mac
            os: macos-15
          - name: Windows x64
            platform: win
            os: windows-2025

    steps:
      # Every matrix job builds the exact same resolved commit, not whatever
      # the workflow file happened to be dispatched from.
      - name: Checkout resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # CODE-01: the release gate. `npm test` = build + typecheck + test:cli +
      # test:electron, each guarded by a pretest:* preflight that fails hard when
      # a runtime prerequisite is missing.
      - name: Test
        run: npm test

      - name: Prepare Apple API key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_BASE64}" ]; then
            KEY_DIR="${RUNNER_TEMP}/apple-api-key"
            mkdir -p "${KEY_DIR}"
            printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${KEY_DIR}/AuthKey.p8"
            chmod 600 "${KEY_DIR}/AuthKey.p8"
            echo "APPLE_API_KEY=${KEY_DIR}/AuthKey.p8" >> "$GITHUB_ENV"
            echo "Apple API key staged for notarization"
          else
            echo "No APPLE_API_KEY_BASE64 secret; notarization will fall back to APPLE_ID credentials if present"
          fi

      # CODE-05A: the stable channel is fail-closed inside build-release.mjs too,
      # so even an edited workflow gate cannot emit an unsigned official build.
      - name: Build package
        shell: bash
        env:
          MFH_RELEASE_CHANNEL: stable
          MFH_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          MFH_RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID certificate (.p12, base64) — mac job only.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          # Notarization (App Store Connect API key preferred, Apple ID fallback).
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          # Windows Authenticode certificate (.pfx, base64) — win job only.
          # Deliberately NOT called CSC_LINK: electron-builder would otherwise
          # try to sign the Windows build with the macOS certificate.
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: npm run dist:${{ matrix.platform }}

      # CODE-04 / CODE-05A / CODE-06: no test code, no dev fake backend, no
      # cross-platform executables — and, on the stable channel, a signature that
      # actually verifies. macOS runs codesign --verify --deep --strict,
      # spctl --assess and stapler validate; Windows checks the Authenticode
      # status and the timestamp countersignature. Any failure fails the job.
      - name: Verify packaged artifacts
        run: npm run verify:artifacts -- --platform ${{ matrix.platform }} --channel stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/build-info-*.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # Re-check immutability at publish time: if the tag moved while the matrix
      # was building, the binaries no longer match the tag and we must not ship.
      - name: Re-verify tag still points at the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          EXPECTED="${{ needs.resolve.outputs.sha }}"
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          OBJ_TYPE="$(printf '%s' "${REF_JSON}" | jq -r '.object.type')"
          OBJ_SHA="$(printf '%s' "${REF_JSON}" | jq -r '.object.sha')"
          if [ "${OBJ_TYPE}" = "tag" ]; then
            CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}" --jq '.object.sha')"
          else
            CURRENT="${OBJ_SHA}"
          fi
          if [ "${CURRENT}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${TAG} moved from ${EXPECTED} to ${CURRENT} during the build; refusing to publish."
            exit 1
          fi
          echo "${TAG} still points at ${EXPECTED}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      # Fails if any build-info is missing or disagrees with the resolved ref,
      # so the published notes can never overstate provenance or signing status.
      - name: Compose release notes
        run: |
          node scripts/compose-release-notes.mjs \
            --dir release-artifacts \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --sha "${{ needs.resolve.outputs.sha }}" \
            --version "${{ needs.resolve.outputs.version }}" \
            --out release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: 发票助手 ${{ needs.resolve.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
